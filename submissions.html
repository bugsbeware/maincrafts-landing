<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainCrafts - Submissions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--dark); background-color: var(--light); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-links a { font-weight: 500; color: var(--dark); transition: var(--transition); font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        .submissions-section { padding: 10rem 2rem 6rem; max-width: 900px; margin: 0 auto; }
        .submissions-header { text-align: center; margin-bottom: 3rem; }
        .submissions-header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .submissions-header p { color: var(--gray); }

        .clear-btn { background: #ef4444; color: white; border: none; padding: 0.6rem 1.2rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: var(--transition); margin-bottom: 2rem; display: inline-block; }
        .clear-btn:hover { background: #dc2626; }

        .submissions-list { display: flex; flex-direction: column; gap: 1.5rem; }
        .sub-card { background: #ffffff; padding: 2rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .sub-card h3 { font-size: 1.2rem; margin-bottom: 0.25rem; color: var(--primary); }
        .sub-card .email { font-size: 0.9rem; color: var(--gray); margin-bottom: 1rem; }
        .sub-card .msg-body { background: var(--light); padding: 1rem; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1rem; }
        .sub-card .date { font-size: 0.8rem; color: var(--gray); text-align: right; }

        .no-data { text-align: center; padding: 4rem 2rem; background: #ffffff; border-radius: 12px; border: 1px solid var(--border); color: var(--gray); font-size: 1.1rem; }

        footer { background: var(--dark); color: #94a3b8; padding: 3rem 2rem; text-align: center; border-top: 1px solid #1e293b; margin-top: 4rem; }
        .footer-links { display: flex; gap: 2rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .footer-links a:hover { color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> MainCrafts</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="submissions.html" class="active">Submissions</a></li>
            </ul>
        </div>
    </header>

    <main class="submissions-section">
        <div class="submissions-header">
            <h1>Contact Form Submissions</h1>
            <p>Review all messages stored locally in your browser.</p>
        </div>

        <div id="action-container"></div>
        <div class="submissions-list" id="submissionsContainer">
            <!-- Dynamically populated by JavaScript -->
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="submissions.html">Submissions</a>
        </div>
        <p>© 2025 MainCrafts. All rights reserved.</p>
    </footer>

    <!-- Script to Load & Display LocalStorage Submissions -->
    <script>
        const container = document.getElementById('submissionsContainer');
        const actionContainer = document.getElementById('action-container');

        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('maincrafts_submissions')) || [];

            container.innerHTML = "";
            actionContainer.innerHTML = "";

            if (submissions.length === 0) {
                container.innerHTML = `<div class="no-data">No submissions found. Try filling out the <a href="contact.html" style="color: var(--primary); text-decoration: underline;">Contact Form</a> first!</div>`;
                return;
            }

            // Add clear button if data exists
            actionContainer.innerHTML = `<button class="clear-btn" onclick="clearSubmissions()">Clear All Submissions</button>`;

            // Render each submission
            submissions.reverse().forEach(sub => {
                const card = document.createElement('div');
                card.className = 'sub-card';
                card.innerHTML = `
                    <h3><i class="fa-solid fa-user"></i> ${escapeHTML(sub.name)}</h3>
                    <div class="email"><i class="fa-solid fa-envelope"></i> ${escapeHTML(sub.email)}</div>
                    <div class="msg-body">"${escapeHTML(sub.message)}"</div>
                    <div class="date"><i class="fa-regular fa-clock"></i> ${sub.date}</div>
                `;
                container.appendChild(card);
            });
        }

        function clearSubmissions() {
            if (confirm("Are you sure you want to delete all stored submissions?")) {
                localStorage.removeItem('maincrafts_submissions');
                loadSubmissions();
            }
        }

        // Security helper to prevent HTML injection in local preview
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Load data on page load
        loadSubmissions();
    </script>

</body>
</html>
