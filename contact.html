<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainCrafts - Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #06b6d4;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; color: var(--dark); background-color: var(--light); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { font-weight: 500; color: var(--dark); transition: var(--transition); }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        .contact-section { padding: 10rem 2rem 6rem; max-width: 600px; margin: 0 auto; }
        .contact-header { text-align: center; margin-bottom: 3rem; }
        .contact-header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .contact-header p { color: var(--gray); }

        .contact-form { background: #ffffff; padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition); }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .form-group textarea { resize: vertical; height: 150px; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #ffffff; padding: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: var(--transition); font-size: 1rem; }
        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Success Message Banner */
        #success-msg { display: none; margin-top: 1rem; padding: 1rem; background: #d1fae5; color: #065f46; border-radius: 8px; text-align: center; font-weight: 500; }

        footer { background: var(--dark); color: #94a3b8; padding: 3rem 2rem; text-align: center; border-top: 1px solid #1e293b; margin-top: 4rem; }
        .footer-links { display: flex; gap: 2rem; justify-content: center; margin-bottom: 1rem; }
        .footer-links a:hover { color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> MainCrafts</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </header>

    <main class="contact-section">
        <div class="contact-header">
            <h1>Get in Touch</h1>
            <p>Have questions or want to collaborate? Send us a message!</p>
        </div>

        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
            <div id="success-msg">Thank you! Your message has been sent successfully.</div>
        </form>
    </main>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <p>© 2025 MainCrafts. All rights reserved.</p>
    </footer>

    <!-- JavaScript Validation Script -->
    <script>
        const form = document.getElementById('contactForm');
        const successMsg = document.getElementById('success-msg');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop form from direct submission

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            // Check if name or email are empty
            if (name === "" || email === "") {
                alert("Please fill in both your Name and Email fields before submitting.");
                return;
            }

            // Simple validation success action
            successMsg.style.display = "block";
            form.reset();

            // Hide success message after 4 seconds
            setTimeout(() => {
                successMsg.style.display = "none";
            }, 4000);
        });
    </script>

</body>
</html>
